<!doctype html>
<!-- Dev tool: renders models exported by `dotnet run` (Tools.Preview). Serve the repo root over HTTP and open
     /unity/Tools.Preview/preview.html?data=<path to models.json>&model=jeepney_pilipinas&yaw=30&pitch=15&dist=9 -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#2b2d33;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script></head>
<body><script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const data = await (await fetch(q.get('data'))).json();
const texDir = q.get('tex') || '/unity/JeepneyRush/Assets/JeepneyRush/Resources/Textures/';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(q.get('bg') || '#2b2d33');
const pm = new THREE.PMREMGenerator(renderer);
const env = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = env;
scene.add(new THREE.HemisphereLight('#ffffff', '#555', 1.2));
const sun = new THREE.DirectionalLight('#fff4e0', 2.5); sun.position.set(-6, 10, 6); sun.castShadow = true; scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: q.get('ground') || '#3a3c42' }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
// palette texture
const P = 16, pal = new Uint8Array(P * P * 4);
data.palette.forEach((c, i) => { pal.set([c[0], c[1], c[2], 255], i * 4); });
const palTex = new THREE.DataTexture(pal, P, P); palTex.magFilter = palTex.minFilter = THREE.NearestFilter; palTex.colorSpace = THREE.SRGBColorSpace; palTex.needsUpdate = true;
const loader = new THREE.TextureLoader();
const mats = {
  paint: new THREE.MeshStandardMaterial({ map: palTex, roughness: 0.4, metalness: 0.1 }),
  chrome: new THREE.MeshStandardMaterial({ map: palTex, roughness: 0.15, metalness: 1 }),
  glass: new THREE.MeshStandardMaterial({ map: palTex, roughness: 0.05, metalness: 0.5 }),
  glow: new THREE.MeshBasicMaterial({ map: palTex }),
};
function mat(key) {
  if (mats[key]) return mats[key];
  if (key === 'gold') return (mats[key] = new THREE.MeshStandardMaterial({ map: palTex, roughness: 0.2, metalness: 1 }));
  const [name, tint] = key.slice(4).split('|');
  const t = loader.load(texDir + name + '.png', undefined, undefined, () => {});
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping;
  const transparent = name === 'para_zone';
  return (mats[key] = new THREE.MeshStandardMaterial({ map: t, roughness: 0.6, metalness: 0.05, color: tint || '#ffffff', transparent }));
}
const names = (q.get('model') || Object.keys(data.models)[0]).split(',');
const spacing = Number(q.get('spacing') || 0);
names.forEach((name, ni) => {
  const m = data.models[name];
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(m.pos), nrm = new Float32Array(m.nrm);
  for (let i = 2; i < pos.length; i += 3) { pos[i] = -pos[i]; nrm[i] = -nrm[i]; } // Unity (left-handed) -> three
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(m.uv), 2));
  const idx = [], materials = [];
  m.sub.forEach((s, si) => {
    const start = idx.length;
    for (let i = 0; i < s.idx.length; i += 3) idx.push(s.idx[i], s.idx[i + 2], s.idx[i + 1]); // flip winding with the mirror
    g.addGroup(start, s.idx.length, si);
    materials.push(mat(s.key));
  });
  g.setIndex(idx);
  const mesh = new THREE.Mesh(g, materials);
  mesh.castShadow = true;
  mesh.position.x = (ni - (names.length - 1) / 2) * spacing;
  scene.add(mesh);
});
const yaw = THREE.MathUtils.degToRad(Number(q.get('yaw') ?? 35)), pitch = THREE.MathUtils.degToRad(Number(q.get('pitch') ?? 15));
const dist = Number(q.get('dist') || 9), ty = Number(q.get('ty') || 1.2);
const cam = new THREE.PerspectiveCamera(Number(q.get('fov') || 40), innerWidth / innerHeight, 0.1, 200);
// yaw 0 = looking at the vehicle's front (Unity +Z is three -Z)
cam.position.set(Math.sin(yaw) * Math.cos(pitch) * dist, ty + Math.sin(pitch) * dist, -Math.cos(yaw) * Math.cos(pitch) * dist);
cam.lookAt(0, ty, 0);
const done = () => setTimeout(() => { renderer.render(scene, cam); document.title = 'ready'; }, 100);
if (Object.keys(mats).some((k) => k.startsWith('tex:'))) { THREE.DefaultLoadingManager.onLoad = done; THREE.DefaultLoadingManager.onError = done; setTimeout(done, 4000); } else done();
</script></body></html>
